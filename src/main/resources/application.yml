spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/core_db #изменить адрес на свой
    username: postgres
    password: 3141 #изменить пароль на свой
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: MySuperSecretKeyThatIsLongEnough123456
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: core-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.OnlineBankingService.kafka.command"

exchange-rate:
  api:
    base-url: https://v6.exchangerate-api.com
    key: 5cc8c7c02bb8c92a81b2eb34

server:
  port: 8081 #изменить на свой сервис: credit service(8084), info service(8085), core(8081)