spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/core_db #изменить адрес на свой
    username: postgres
    password: 3141 #изменить пароль на свой
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

server:
  port: 8081 #изменить на свой сервис: credit service(8084), info service(8085), core(8081)