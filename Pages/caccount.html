<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Styles/caccount.css">
  <link rel="stylesheet" href="../Styles/general.css">
  <title>Copy page</title>
</head>
<body>
  <header>
    <div class="log">
      <img src="../sorces/logo.png" id="logoimg">
      <a href="../Pages/main.html" class="return">Главная</a>
      <a href="../Pages/accounts.html" class="return">Назад</a>
    </div>
    <span type="submit"  id="in">Вход</span>
    <div id="userMenu" style="display: none">
      <button id="profileButton">Личный кабинет</button>
      <button id="logoutButton">Выход</button>
  </div>
  </header>
  <main>
    <div class="block-column">
      <div class="info-text">Это ваш кредитный счёт.</div> 
      <div id="CreditAccount-container">
        <template id="CreditAccount-template">
          <div class="CreditAccount-block">
            <div class="name"></div>
            <div class="balance"></div>
            <div class="status"></div>
            <div class="createdDate"></div>
          </div>
        </template>
      </div>
      
      <div id="Money-container">
        <div class="info-text">Вы можете:</div> 
        <div class="block-row">
          <button id="openAccountButton" onclick=withdraw()>Снять с него деньги</button>
          <div class="info-text"> На сумму</div> 
          <input type="amount" id="amount" placeholder="1000"> 
          <div class="info-text">₽.</div> 
        </div>
          <div class="info-text">Операции этого счёта:</div> 
        </div>
        <div id="Operstions-container">
          <template id="Operstions-template">
            <div class="Operstions-block">
              <div class="date"></div>
              <div class="time"></div>
              <div class="amount"></div>
              <div class="operationType"></div>
              <div class="comment"></div>
            </div>
          </template>
        </div>
    </div> 
  </main>
  <footer>
    <div class="foot-text">© 2026 - Belochka</div> 
  </footer>
  <script src="../Scripts/caccount.js"></script>
</body>
</html>
