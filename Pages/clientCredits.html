<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Styles/clientCredits.css">
  <link rel="stylesheet" href="../Styles/general.css">
  <title>Copy page</title>
</head>
<body>
  <header>
    <div class="log">
      <img src="../sorces/logo.png" id="logoimg">
      <a href="../Pages/main.html" class="return">Главная</a>
    </div>
    <span type="submit"  id="in">Вход</span>
    <div id="userMenu" style="display: none">
      <button id="profileButton">Личный кабинет</button>
      <button id="logoutButton">Выход</button>
  </div>
  </header>

<main>
  <div class="container">
    <h1>Ваши кредиты</h1>

    <div class="filters">
      <h3>Фильтры</h3>
      <div class="filter-grid">
        <input type="text" id="clientId" placeholder="Id клиента">
        <input type="number" id="creditAmountFrom" placeholder="Сумма кредита от">
        <input type="number" id="creditAmountTo" placeholder="Сумма кредита до">
        <input type="number" id="debtAmountFrom" placeholder="Долг от">
        <input type="number" id="debtAmountTo" placeholder="Долг до">

        <select id="creditStatus">
          <option value="">Статус кредита</option>
          <option value="ACTIVE">Активен</option>
          <option value="CLOSED">Закрыт</option>
          <option value="OVERDUE">Просрочка</option>
        </select>

        <select id="sortBy">
          <option value="">Сортировать по</option>
          <option value="creditAmount">Сумма кредита</option>
          <option value="debtAmount">Долг</option>
          <option value="createdAt">Дата создания</option>
        </select>

        <select id="direction">
          <option value="asc">По возрастанию</option>
          <option value="desc">По убыванию</option>

        </select>

        <input type="number" id="pageSize" value="5" min="1" placeholder="Размер страницы">
      </div>

      <button id="applyFilters">Применить</button>
    </div>

    <div id="creditList"></div>
    <div id="pagination" class="pagination"></div>
  </div>
</main>

<footer>
  <div class="foot-text">© 2026 - Belochka</div>
</footer>

<script src="../Scripts/clientCredits.js"></script>
</body>
</html>
