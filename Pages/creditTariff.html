<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Styles/creditTariff.css">
  <link rel="stylesheet" href="../Styles/general.css">
  <title>Copy page</title>
</head>
<body>
  <header>
    <div class="log">
      <img src="../sorces/logo.png" id="logoimg">
      <a href="../Pages/main.html" class="return">Главная</a>
    </div>
    <span type="submit"  id="in">Вход</span>
    <div id="userMenu" style="display: none">
      <button id="profileButton">Личный кабинет</button>
      <button id="logoutButton">Выход</button>
  </div>
  </header>
  <main>
  <div class="container">
    <h1>Кредитные тарифы</h1>

    <button id="createTariffBtn" class="create-btn">
      Создать кредитный тариф
    </button>

    <div class="filters">
    <h3>Фильтры</h3>

    <div class="filter-grid">
      <input type="text" id="filterName" placeholder="Название">
      <input type="text" id="filterDescription" placeholder="Описание">

      <input type="number" id="filterAmountFrom" placeholder="Сумма от">
      <input type="number" id="filterAmountTo" placeholder="Сумма до">

      <input type="number" id="filterInterestRate" placeholder="Процент">

      <select id="sortBy">
        <option value="">Сортировать по</option>
        <option value="name">Название</option>
        <option value="amountFrom">Сумма от</option>
        <option value="amountTo">Сумма до</option>
        <option value="interestRate">Процент</option>
      </select>

      <select id="direction">
        <option value="asc">По возрастанию</option>
        <option value="desc">По убыванию</option>
      </select>
      <input type="number" id="pageSize" placeholder="Размер страницы" value="5" min="1">
  </div>

  <button id="applyFilters">Применить</button>
</div>

    <div id="tariffList">
    </div>
  </div>
</main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="createTitle">Создание кредитного тарифа</h2>

      <form id="createTariffForm">
        <label>Название тарифа:</label>
        <input type="text" id="name" required>

        <label>Описание:</label>
        <textarea id="description" required></textarea>

        <label>Сумма от:</label>
        <input type="number" id="amountFrom" required>

        <label>Сумма до:</label>
        <input type="number" id="amountTo" required>

        <label>Процентная ставка:</label>
        <input type="number" id="interestRate" required>

        <button type="submit" class="submit-btn">Создать</button>
      </form>
    </div>
  </div>
  <div id="pagination" class="pagination"></div>
  <footer>
    <div class="foot-text">© 2026 - Belochka</div> 
  </footer>
  <script src="../Scripts/creditTariff.js"></script>
</body>
</html>
